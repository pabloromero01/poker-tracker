<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Tracker · Amigos de Pitu</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a2e1a">
<style>
/* ============================================================
   Poker Tracker — Tema "Noche de póker" (versión móvil)
   ============================================================ */
:root {
  --oro: #e8b43a;
  --oro-claro: #f5d47a;
  --rojo: #d63b3b;
  --verde-panel: #0f3d26;
  --verde-panel-claro: #17573a;
  --crema: #f3ead5;
  --gris-texto: #b8c4bb;
  --negro: #1a1405;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--crema);
  background: radial-gradient(ellipse at 50% 20%, #14532d, #0a2e1a 60%, #051c0f);
  background-attachment: fixed;
  min-height: 100vh;
  padding-bottom: calc(74px + env(safe-area-inset-bottom));
}
main { padding: 14px; max-width: 640px; margin: 0 auto; }
h1 {
  color: var(--oro);
  font-size: 1.5rem;
  margin: 8px 0 14px;
  text-shadow: 0 2px 4px rgba(0,0,0,.6);
}
h2 { color: var(--oro-claro); font-size: 1.05rem; margin: 0 0 10px; }
.suave { color: var(--gris-texto); font-size: .85rem; }

/* ---------- Paneles tipo carta ---------- */
.carta {
  background: var(--verde-panel);
  border: 1.5px solid rgba(232,180,58,.45);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 4px 12px rgba(0,0,0,.5);
}

/* ---------- Botones ---------- */
button {
  font: inherit;
  cursor: pointer;
  border: 1px solid rgba(243,234,213,.25);
  background: #1c4a33;
  color: var(--crema);
  border-radius: 8px;
  padding: 9px 14px;
}
button:active { transform: scale(.97); }
.b-oro {
  background: linear-gradient(to bottom, var(--oro-claro), var(--oro));
  color: var(--negro);
  font-weight: bold;
  font-size: 1rem;
  border: 1px solid #a37b1e;
  border-radius: 10px;
  padding: 12px 22px;
  box-shadow: 0 3px 6px rgba(0,0,0,.4);
}
.b-rojo {
  background: linear-gradient(to bottom, #e35050, var(--rojo));
  color: white;
  font-weight: bold;
  border: 1px solid #8f2222;
  border-radius: 10px;
  padding: 10px 18px;
}
.b-ficha {
  background: linear-gradient(to bottom, #4d8cd6, #2f6cb5);
  color: white;
  font-weight: bold;
  border: 2px dashed white;
  border-radius: 18px;
  padding: 7px 14px;
  font-size: .85rem;
}
.b-ancho { width: 100%; }
.fila-botones { display: flex; gap: 10px; flex-wrap: wrap; }
.fila-botones > * { flex: 1; }

/* ---------- Formularios ---------- */
input[type=text], input[type=number], input[type=date], select {
  font: inherit;
  width: 100%;
  background: #0b2b1b;
  color: var(--crema);
  border: 1px solid rgba(232,180,58,.35);
  border-radius: 8px;
  padding: 10px;
}
input:focus, select:focus { outline: none; border-color: var(--oro); }
label { display: block; margin: 10px 0 4px; font-size: .9rem; }

/* Chips de selección (buy-in y jugadores) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: #0b2b1b;
  border: 1.5px solid rgba(232,180,58,.4);
  border-radius: 20px;
  padding: 8px 16px;
  font-weight: bold;
  user-select: none;
}
.chip.activo {
  background: linear-gradient(to bottom, var(--oro-claro), var(--oro));
  color: var(--negro);
  border-color: #a37b1e;
}

/* ---------- Tarjetas de jugador (partida en vivo) ---------- */
.tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tj {
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,.5);
}
.tj-viva {
  background: linear-gradient(to bottom, #1b6b45, #0f3d26);
  border: 2px solid var(--oro);
}
.tj-muerta {
  background: #2b2b2b;
  border: 2px solid #555;
  opacity: .75;
}
.tj .nombre { font-size: 1rem; font-weight: bold; color: white; margin-bottom: 4px; }
.tj .info { font-size: .75rem; color: var(--oro-claro); margin-bottom: 8px; }

/* ---------- Bote ---------- */
.bote {
  display: inline-block;
  background: var(--negro);
  border: 2.5px solid var(--oro);
  border-radius: 30px;
  padding: 8px 22px;
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--oro-claro);
  margin-bottom: 12px;
}

/* ---------- Tablas ---------- */
.tabla-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
th {
  background: var(--negro);
  color: var(--oro);
  padding: 8px 6px;
  text-align: left;
  white-space: nowrap;
}
td { padding: 8px 6px; border-top: 1px solid rgba(232,180,58,.15); white-space: nowrap; }
tr:nth-child(even) td { background: rgba(0,0,0,.18); }
tr.sel td { background: var(--oro); color: var(--negro); font-weight: bold; }

/* ---------- Registro (log) ---------- */
.log { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; }
.log li { padding: 6px 4px; border-bottom: 1px solid rgba(232,180,58,.15); font-size: .85rem; }

/* ---------- Sub-pestañas ---------- */
.subtabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.subtab {
  flex: 1;
  text-align: center;
  padding: 8px 4px;
  background: var(--verde-panel);
  border: 1px solid rgba(232,180,58,.35);
  border-radius: 10px;
  font-size: .85rem;
  font-weight: bold;
  user-select: none;
}
.subtab.activo { background: linear-gradient(to bottom, var(--oro-claro), var(--oro)); color: var(--negro); }

/* ---------- Barra de navegación inferior ---------- */
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: #051c0f;
  border-top: 1.5px solid rgba(232,180,58,.4);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 10;
}
nav button {
  flex: 1;
  background: none;
  border: none;
  border-radius: 0;
  color: var(--gris-texto);
  font-size: .7rem;
  padding: 8px 2px 10px;
}
nav button .ico { display: block; font-size: 1.4rem; }
nav button.activo { color: var(--oro); }

/* ---------- Matriz de eliminaciones ---------- */
.matriz td, .matriz th { text-align: center; }
.matriz th:first-child { text-align: left; }

/* ---------- Diálogo de reparto ---------- */
dialog {
  background: var(--verde-panel);
  color: var(--crema);
  border: 2px solid var(--oro);
  border-radius: 14px;
  max-width: 90vw;
  width: 380px;
  padding: 16px;
}
dialog::backdrop { background: rgba(0,0,0,.65); }
.fila-premio { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.fila-premio span:first-child { flex: 1; }
.fila-premio input { width: 90px; text-align: right; }

.detalle { white-space: pre-wrap; font-size: .82rem; background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px; }
.oculto { display: none !important; }
</style>
</head>
<body>

<main id="app"></main>

<nav>
  <button data-pantalla="partida"><span class="ico">🃏</span>Partida</button>
  <button data-pantalla="historial"><span class="ico">📋</span>Historial</button>
  <button data-pantalla="stats"><span class="ico">📊</span>Estadísticas</button>
  <button data-pantalla="jugadores"><span class="ico">👥</span>Jugadores</button>
  <button data-pantalla="futuras"><span class="ico">📅</span>Futuras</button>
  <button data-pantalla="ajustes"><span class="ico">⚙</span>Ajustes</button>
</nav>

<dialog id="dlgReparto"></dialog>
<dialog id="dlgEditar"></dialog>

<script type="module">
/* ============================================================
   ALMACENAMIENTO
   - Copia local en el dispositivo (localStorage): permite abrir
     la app al instante y funcionar sin conexión.
   - Copia en la nube (Firestore): sincroniza a todos los móviles
     del grupo en tiempo real.
   Todo el grupo comparte un "código de grupo" que funciona como
   identificador y contraseña de vuestra base de datos.
   ============================================================ */
const CLAVE = 'pokerTrackerDatos';
const CLAVE_GRUPO = 'pokerTrackerGrupo';
let memoria = null; // respaldo en memoria por si el navegador bloquea localStorage

function datosVacios() {
  return { jugadores: [], partidas: [], siguienteIdJugador: 1, siguienteIdPartida: 1 };
}
function cargar() {
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (crudo) return JSON.parse(crudo);
  } catch (e) { /* almacenamiento no disponible */ }
  return memoria ? memoria : datosVacios();
}
function guardarLocal(d) {
  memoria = d;
  try { localStorage.setItem(CLAVE, JSON.stringify(d)); } catch (e) { /* seguimos en memoria */ }
}

/* Guarda en local y, si hay nube configurada, sube los cambios */
function guardar(d) {
  guardarLocal(d);
  subirANube(d);
}

let DB = cargar();

/* ============================================================
   SINCRONIZACIÓN CON FIREBASE + CUENTAS DE USUARIO
   La configuración vive en firebase-config.js. Si ese fichero no
   existe o no está configurado, la app sigue funcionando en modo
   local (como antes), solo que sin compartir datos.

   A partir de ahora, sincronizar con el grupo requiere haber
   iniciado sesión con una cuenta real (usuario + contraseña),
   para que los puntos, el perfil y las apuestas sean de verdad
   tuyos y no de cualquiera que sepa el código de grupo.
   ============================================================ */
let codigoGrupo = '';
try { codigoGrupo = localStorage.getItem(CLAVE_GRUPO) || ''; } catch (e) {}

let modAuth = null, modFs = null, firebaseApp = null, authObj = null, firestoreDb = null;
let firebaseCargado = false;
let errorFirebase = '';

async function asegurarFirebase() {
  if (firebaseCargado) return true;
  try {
    const { firebaseConfig } = await import('./firebase-config.js');
    if (!firebaseConfig || !firebaseConfig.projectId || firebaseConfig.projectId.includes('AQUI')) {
      throw new Error('Falta configurar firebase-config.js.');
    }
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    modAuth = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    modFs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    firebaseApp = initializeApp(firebaseConfig);
    authObj = modAuth.getAuth(firebaseApp);
    firebaseCargado = true;
    return true;
  } catch (e) {
    errorFirebase = e.message;
    return false;
  }
}

async function obtenerFirestoreDb() {
  if (firestoreDb) return firestoreDb;
  try {
    firestoreDb = modFs.initializeFirestore(firebaseApp, {
      localCache: modFs.persistentLocalCache({ tabManager: modFs.persistentMultipleTabManager() })
    });
  } catch (e) {
    firestoreDb = modFs.getFirestore(firebaseApp); // si la caché falla, seguimos sin ella
  }
  return firestoreDb;
}

let nube = null;        // { ref, setDoc }
let estadoNube = 'local'; // local | conectando | ok | error
let mensajeNube = '';
let escuchando = null;  // función para dejar de escuchar al cambiar de grupo

async function iniciarNube() {
  if (!codigoGrupo) return;
  estadoNube = 'conectando';
  render();
  const ok = await asegurarFirebase();
  if (!ok) { estadoNube = 'error'; mensajeNube = errorFirebase; render(); return; }
  try {
    await modAuth.signInAnonymously(authObj);
    const db = await obtenerFirestoreDb();
    const ref = modFs.doc(db, 'grupos', codigoGrupo);
    nube = { ref, setDoc: modFs.setDoc };

    if (escuchando) { escuchando(); escuchando = null; }
    // Escuchamos cambios: cualquier móvil del grupo que guarde algo
    // actualiza esta pantalla automáticamente
    escuchando = modFs.onSnapshot(ref, snap => {
      estadoNube = 'ok';
      if (snap.exists() && snap.data().json) {
        try {
          const remoto = JSON.parse(snap.data().json);
          DB = remoto;
          guardarLocal(DB);
          aplicarBonoDiario();
        } catch (e) { /* documento corrupto: ignoramos */ }
      } else {
        // El grupo aún no existe en la nube: subimos lo que tengamos en local
        subirANube(DB);
      }
      render();
    }, err => {
      estadoNube = 'error';
      mensajeNube = err.code === 'permission-denied'
        ? 'Permiso denegado: revisa las reglas de Firestore.'
        : err.message;
      render();
    });
  } catch (e) {
    estadoNube = 'error';
    mensajeNube = e.message;
    render();
  }
}

function subirANube(d) {
  if (!nube) return;
  nube.setDoc(nube.ref, { json: JSON.stringify(d), actualizado: Date.now() })
    .catch(err => { estadoNube = 'error'; mensajeNube = err.message; render(); });
}

function cambiarGrupo(codigo) {
  if (escuchando) { escuchando(); escuchando = null; }
  nube = null;
  codigoGrupo = codigo.trim();
  try { localStorage.setItem(CLAVE_GRUPO, codigoGrupo); } catch (e) {}
  estadoNube = codigoGrupo ? 'conectando' : 'local';
  iniciarNube();
  render();
}

function textoEstadoNube() {
  if (!codigoGrupo) return '📴 Solo este dispositivo';
  if (estadoNube === 'conectando') return '⏳ Conectando...';
  if (estadoNube === 'ok') return '☁ Sincronizado · grupo ' + codigoGrupo;
  if (estadoNube === 'error') return '⚠ Sin sincronizar: ' + mensajeNube;
  return '📴 Solo este dispositivo';
}

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = sel => document.querySelector(sel);
const eur = n => n.toFixed(2).replace('.', ',') + ' €';
const nombreJugador = id => (DB.jugadores.find(j => j.id === id) || { nombre: '?' }).nombre;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toISOString().slice(0, 10);

/* Dinero total metido por una participación */
const invertido = (p, buyin) => (1 + p.recompras + p.addons) * buyin;
const botePartida = pa => pa.participaciones.reduce((s, p) => s + invertido(p, pa.buyin), 0);

/* ============================================================
   PERFILES Y LOGROS
   Todo se calcula al vuelo a partir de DB.partidas — no se
   guarda nada nuevo, así que no hay riesgo para los datos.
   ============================================================ */
function statsCompletos(jugadorId) {
  let partidas = 0, victorias = 0, inv = 0, gan = 0, elimHechas = 0, vecesCaido = 0, top3 = 0;
  let indestructible = false;
  const buyinsSet = new Set();
  const porRival = {};

  for (const p of DB.partidas) {
    const x = p.participaciones.find(y => y.jugadorId === jugadorId);
    if (x) {
      partidas++;
      inv += invertido(x, p.buyin);
      gan += x.premio;
      buyinsSet.add(p.buyin);
      if (x.posicion === 1) {
        victorias++;
        if (x.recompras === 0 && x.addons === 0) indestructible = true;
      }
      if (x.posicion && x.posicion <= 3) top3++;
    }
    for (const e of p.eliminaciones) {
      if (e.eliminadorId === jugadorId) {
        elimHechas++;
        porRival[e.eliminadoId] = (porRival[e.eliminadoId] || 0) + 1;
      }
      if (e.eliminadoId === jugadorId) vecesCaido++;
    }
  }
  const maxRival = Object.values(porRival).length ? Math.max(...Object.values(porRival)) : 0;

  return {
    partidas, victorias, inv, gan, balance: gan - inv,
    elimHechas, vecesCaido, top3, maxRival,
    buyinsDistintos: buyinsSet.size, indestructible
  };
}

const LOGROS = [
  { id: 'primera', icono: '🥇', nombre: 'Primera Victoria', desc: 'Gana tu primera partida', check: s => s.victorias >= 1 },
  { id: 'triple', icono: '🏆', nombre: 'Triple Corona', desc: 'Gana 3 partidas', check: s => s.victorias >= 3 },
  { id: 'verdugo', icono: '💀', nombre: 'Verdugo', desc: 'Consigue 10 eliminaciones', check: s => s.elimHechas >= 10 },
  { id: 'masacre', icono: '⚔', nombre: 'Masacre', desc: 'Consigue 25 eliminaciones', check: s => s.elimHechas >= 25 },
  { id: 'nemesis', icono: '🎯', nombre: 'Némesis Declarada', desc: 'Elimina 3 veces al mismo rival', check: s => s.maxRival >= 3 },
  { id: 'subcampeon', icono: '🥈', nombre: 'Casi, casi', desc: 'Queda entre los 3 primeros 5 veces', check: s => s.top3 >= 5 },
  { id: 'todoterreno', icono: '💶', nombre: 'Todoterreno', desc: 'Juega partidas de 5 € y de 10 €', check: s => s.buyinsDistintos >= 2 },
  { id: 'indestructible', icono: '🦾', nombre: 'Indestructible', desc: 'Gana una partida sin recompras ni add-ons', check: s => s.indestructible },
  { id: 'veterano', icono: '📅', nombre: 'Veterano', desc: 'Juega 10 partidas', check: s => s.partidas >= 10 }
];

/* ============================================================
   PUNTOS (moneda interna de apuestas)
   Todo el mundo empieza con 1000 puntos la primera vez que se
   necesita su saldo. Se puede arriesgar en apuestas y se recibe
   un bono de 100 puntos una vez al día.
   ============================================================ */

/** Lectura pura: no modifica DB, útil para pintar en pantalla. */
function puntosDe(jugadorId) {
  return (DB.puntos && DB.puntos[jugadorId] !== undefined) ? DB.puntos[jugadorId] : 1000;
}

/** Solo se llama justo antes de modificar el saldo de alguien. */
function asegurarPuntosInicializados(jugadorId) {
  if (!DB.puntos) DB.puntos = {};
  if (!(jugadorId in DB.puntos)) DB.puntos[jugadorId] = 1000;
}

/**
 * Da +100 puntos a cada jugador, una vez por día natural. Si el
 * grupo no abre la app un día, ese día se pierde (no se acumula).
 */
function aplicarBonoDiario() {
  const fechaHoy = hoy();
  if (!DB.bonoDiario) DB.bonoDiario = {};
  let cambios = false;
  for (const j of DB.jugadores) {
    const registro = DB.bonoDiario[j.id];
    if (!registro || registro.ultimaFecha !== fechaHoy) {
      asegurarPuntosInicializados(j.id);
      DB.puntos[j.id] += 100;
      DB.bonoDiario[j.id] = { ultimaFecha: fechaHoy };
      cambios = true;
    }
  }
  if (cambios) guardar(DB);
}

/* ============================================================
   CUOTAS
   Se calculan matemáticamente a partir del historial de partidas,
   no a mano. Ambas fórmulas están acotadas para que nunca sean
   ridículamente bajas ni absurdamente altas.
   ============================================================ */

/** "Fuerza" de un jugador para el mercado de ganador: su % de victorias. */
function fuerzaJugador(jugadorId) {
  const s = statsCompletos(jugadorId);
  return s.partidas > 0 ? (s.victorias / s.partidas) + 0.05 : 0.2;
}

/**
 * Cuota de "este jugador va a ganar la partida", repartiendo la
 * probabilidad entre todos los candidatos según su % de victorias
 * histórico (cuota justa = 1 / probabilidad implícita).
 */
function cuotaGanador(candidatoId, participantesIds) {
  const fuerzas = participantesIds.map(id => ({ id, f: fuerzaJugador(id) }));
  const total = fuerzas.reduce((s, x) => s + x.f, 0);
  const propia = (fuerzas.find(x => x.id === candidatoId) || { f: 0.2 }).f;
  const prob = total > 0 ? propia / total : 1 / participantesIds.length;
  const cuota = 1 / Math.max(prob, 0.01);
  return Math.min(10, Math.max(1.2, Math.round(cuota * 10) / 10));
}

/**
 * Cuota de "voy a eliminar a este jugador yo mismo", calculada por
 * la diferencia entre tus eliminaciones históricas y las suyas:
 * si tú matas mucho más que él, cuota baja (apuesta "segura");
 * si él es más matón que tú, cuota alta (apuesta arriesgada).
 */
function cuotaMatar(miJugadorId, objetivoId) {
  const misKills = statsCompletos(miJugadorId).elimHechas;
  const susKills = statsCompletos(objetivoId).elimHechas;
  const diferencia = misKills - susKills;
  const cuota = 2.2 - diferencia * 0.15;
  return Math.min(6, Math.max(1.2, Math.round(cuota * 10) / 10));
}

/**
 * Cuando se guarda una partida real, resuelve todas las "futuras
 * partidas" pendientes que tuvieran esa misma fecha: paga a quien
 * acertó (apuesta × cuota) y no hace nada con quien falló (ya
 * perdió su apuesta al hacerla).
 */
function resolverFuturasSiCorresponde(partida) {
  const futuras = DB.partidasFuturas || [];
  const pendientes = futuras.filter(f => f.fecha === partida.fecha);
  if (!pendientes.length) return;

  const ganador = partida.participaciones.find(x => x.posicion === 1);

  for (const futura of pendientes) {
    for (const ap of futura.apuestasGanador || []) {
      asegurarPuntosInicializados(ap.jugadorId);
      if (ganador && ap.objetivoId === ganador.jugadorId) {
        DB.puntos[ap.jugadorId] += Math.round(ap.cantidad * ap.cuota);
      }
    }
    for (const ap of futura.apuestasMatar || []) {
      asegurarPuntosInicializados(ap.jugadorId);
      const acierto = partida.eliminaciones.some(e =>
        e.eliminadorId === ap.jugadorId && e.eliminadoId === ap.objetivoId);
      if (acierto) {
        DB.puntos[ap.jugadorId] += Math.round(ap.cantidad * ap.cuota);
      }
    }
  }

  if (!DB.historialApuestasFuturas) DB.historialApuestasFuturas = [];
  for (const futura of pendientes) {
    DB.historialApuestasFuturas.unshift({ ...futura, resuelta: partida.fecha });
  }
  DB.partidasFuturas = futuras.filter(f => f.fecha !== partida.fecha);
}

/* ============================================================
   ESTADO DE LA PARTIDA EN CURSO (no se guarda hasta finalizar)
   Se va guardando un BORRADOR en el dispositivo con cada acción,
   para poder recuperarla si el móvil cierra la app a mitad de partida.
   ============================================================ */
let enCurso = null; // null = pantalla de configuración

const CLAVE_BORRADOR = 'pokerTrackerBorrador';

function guardarBorrador() {
  try {
    if (enCurso) localStorage.setItem(CLAVE_BORRADOR, JSON.stringify(enCurso));
    else localStorage.removeItem(CLAVE_BORRADOR);
  } catch (e) { /* sin almacenamiento disponible */ }
}
function cargarBorrador() {
  try {
    const crudo = localStorage.getItem(CLAVE_BORRADOR);
    return crudo ? JSON.parse(crudo) : null;
  } catch (e) { return null; }
}
function borrarBorrador() {
  try { localStorage.removeItem(CLAVE_BORRADOR); } catch (e) {}
}

// Al arrancar la app comprobamos si hay una partida a medias sin cerrar
let borradorPendiente = cargarBorrador();

function nuevaPartidaEnCurso(buyin, fecha, notas, ids) {
  return {
    buyin, fecha, notas,
    vivos: [...ids],
    eliminados: [],          // en orden de eliminación
    eliminaciones: [],       // {eliminadorId, eliminadoId, orden}
    recompras: Object.fromEntries(ids.map(id => [id, 0])),
    addons: Object.fromEntries(ids.map(id => [id, 0])),
    log: [],
    acciones: []             // pila para deshacer: {tipo, jugadorId, indice}
  };
}

function boteEnCurso() {
  const g = enCurso;
  let entradas = g.vivos.length + g.eliminados.length;
  for (const id of Object.keys(g.recompras)) entradas += g.recompras[id] + g.addons[id];
  return entradas * g.buyin;
}

function infoInversion(id) {

}

/* --- Acciones de la partida en vivo --- */
function accionEliminar() {
  const g = enCurso;
  const eliminador = parseInt($('#selEliminador').value);
  const eliminado = parseInt($('#selEliminado').value);
  if (!eliminador || !eliminado) return alerta('Selecciona el eliminador y el eliminado.');
  if (eliminador === eliminado) return alerta('Un jugador no puede eliminarse a sí mismo.');

  g.eliminaciones.push({ eliminadorId: eliminador, eliminadoId: eliminado, orden: g.eliminaciones.length + 1 });
  g.vivos = g.vivos.filter(id => id !== eliminado);
  g.eliminados.push(eliminado);
  g.acciones.push({ tipo: 'ELIMINACION', jugadorId: eliminado });
  g.log.push(`${g.eliminaciones.length}. 💀 ${nombreJugador(eliminador)} eliminó a ${nombreJugador(eliminado)}`);

  // Bono de puntos: si el eliminador tenía marcada esta víctima como preferida
  const perfil = (DB.perfilesJugador || {})[eliminador];
  if (perfil && perfil.victimaPreferidaId === eliminado) {
    asegurarPuntosInicializados(eliminador);
    DB.puntos[eliminador] += 5;
    g.log.push(`🎯 ¡${nombreJugador(eliminador)} cumplió su objetivo secreto! (+5 puntos)`);
    guardar(DB); // no perder el punto aunque la app se cierre antes de acabar la partida
  }

  if (g.vivos.length === 1) {
    g.log.push(`🏆 ¡${nombreJugador(g.vivos[0])} gana... si nadie hace recompra!`);
  }
  render();
}

function accionAddon(id) {
  const g = enCurso;
  g.addons[id]++;
  g.acciones.push({ tipo: 'ADDON', jugadorId: id });
  g.log.push(`➕ ${nombreJugador(id)} hizo un add-on (+${eur(g.buyin)} al bote)`);
  render();
}

function accionRecompra(id) {
  const g = enCurso;
  const indice = g.eliminados.indexOf(id);
  if (indice < 0) return;
  g.eliminados.splice(indice, 1);
  g.vivos.push(id);
  g.recompras[id]++;
  g.acciones.push({ tipo: 'RECOMPRA', jugadorId: id, indice });
  g.log.push(`💶 ${nombreJugador(id)} hizo una recompra y vuelve a la mesa (+${eur(g.buyin)} al bote)`);
  render();
}

function accionDeshacer() {
  const g = enCurso;
  if (!g.acciones.length) return;
  const a = g.acciones.pop();
  // Quitamos el anuncio de ganador si es la última línea
  if (g.log.length && g.log[g.log.length - 1].startsWith('🏆')) g.log.pop();
  if (g.log.length) g.log.pop();

  if (a.tipo === 'ELIMINACION') {
    g.eliminaciones.pop();
    g.eliminados.pop();
    g.vivos.push(a.jugadorId);
  } else if (a.tipo === 'ADDON') {
    g.addons[a.jugadorId]--;
  } else { // RECOMPRA
    g.vivos = g.vivos.filter(id => id !== a.jugadorId);
    g.eliminados.splice(a.indice, 0, a.jugadorId);
    g.recompras[a.jugadorId]--;
  }
  render();
}

/* --- Finalizar: diálogo de reparto y guardado --- */
function accionFinalizar() {
  const g = enCurso;
  if (g.vivos.length > 1 &&
      !confirm(`Todavía quedan ${g.vivos.length} jugadores vivos. ¿Guardar igualmente (sin ganador)?`)) return;

  const bote = boteEnCurso();
  // Orden para el reparto: vivos primero (ganador), luego eliminados del último al primero
  const orden = [...g.vivos, ...[...g.eliminados].reverse()];

  const dlg = $('#dlgReparto');
  dlg.innerHTML = `
    <h2>Reparto del bote: ${eur(bote)}</h2>
    <p class="suave">Por defecto todo al ganador. Ajusta si repartís (70/30, etc.).</p>
    ${orden.map((id, i) => `
      <div class="fila-premio">
        <span>${i + 1}º ${esc(nombreJugador(id))}</span>
        <input type="number" min="0" step="0.5" data-premio="${id}"
               value="${i === 0 && g.vivos.length === 1 ? bote : 0}"> €
      </div>`).join('')}
    <div class="fila-botones" style="margin-top:14px">
      <button id="btnRepartoCancelar">Cancelar</button>
      <button class="b-oro" id="btnRepartoOk">Guardar partida</button>
    </div>`;
  dlg.showModal();

  $('#btnRepartoCancelar').onclick = () => dlg.close();
  $('#btnRepartoOk').onclick = () => {
    const premios = {};
    let suma = 0;
    for (const inp of dlg.querySelectorAll('[data-premio]')) {
      const v = parseFloat(inp.value) || 0;
      if (v < 0) return alerta('Los premios no pueden ser negativos.');
      premios[inp.dataset.premio] = v;
      suma += v;
    }
    if (Math.abs(suma - bote) > 0.01 &&
        !confirm(`Ojo: el reparto suma ${eur(suma)} pero el bote es ${eur(bote)}. ¿Guardar igualmente?`)) return;

    guardarPartidaTerminada(premios);
    dlg.close();
  };
}

function guardarPartidaTerminada(premios) {
  const g = enCurso;
  const total = g.vivos.length + g.eliminados.length;
  const participaciones = [];

  if (g.vivos.length === 1) {
    const id = g.vivos[0];
    participaciones.push({ jugadorId: id, recompras: g.recompras[id], addons: g.addons[id],
      posicion: 1, premio: premios[id] || 0 });
  } else {
    for (const id of g.vivos) {
      participaciones.push({ jugadorId: id, recompras: g.recompras[id], addons: g.addons[id],
        posicion: null, premio: premios[id] || 0 });
    }
  }
  // El último eliminado es 2º (si hay ganador), el anterior 3º, etc.
  let pos = g.vivos.length === 1 ? 2 : total - g.eliminados.length + 1;
  for (let i = g.eliminados.length - 1; i >= 0; i--) {
    const id = g.eliminados[i];
    participaciones.push({ jugadorId: id, recompras: g.recompras[id], addons: g.addons[id],
      posicion: pos++, premio: premios[id] || 0 });
  }

  const partidaGuardada = {
    id: DB.siguienteIdPartida++,
    fecha: g.fecha, buyin: g.buyin, notas: g.notas,
    participaciones, eliminaciones: g.eliminaciones
  };
  DB.partidas.push(partidaGuardada);
  resolverFuturasSiCorresponde(partidaGuardada);
  guardar(DB);
  enCurso = null;
  borrarBorrador();
  selJugadores = new Set();
  alerta('✅ Partida guardada.');
  render();
}

function detallePartida(p) {
  const orden = [...p.participaciones].sort((a, b) =>
    (a.posicion ?? 99) - (b.posicion ?? 99));
  let t = 'CLASIFICACIÓN\n';
  for (const x of orden) {
    const bal = x.premio - invertido(x, p.buyin);
    t += `  ${x.posicion ? x.posicion + 'º' : '-'}  ${esc(nombreJugador(x.jugadorId))}` +
         `  |  R: ${x.recompras}  A: ${x.addons}  |  Premio: ${eur(x.premio)}` +
         `  |  Balance: ${bal >= 0 ? '+' : ''}${eur(bal)}\n`;
  }
  t += '\nELIMINACIONES\n';
  if (!p.eliminaciones.length) t += '  (sin eliminaciones registradas)\n';
  for (const e of p.eliminaciones) {
    t += `  ${e.orden}. ${esc(nombreJugador(e.eliminadorId))} eliminó a ${esc(nombreJugador(e.eliminadoId))}\n`;
  }
  return t;
}

/* ============================================================
   EDICIÓN DE PARTIDAS YA GUARDADAS
   Permite corregir fecha, buy-in, notas, posiciones, recompras,
   add-ons, premios y la lista de eliminaciones de una partida
   que ya está en el historial.
   ============================================================ */
function editarPartida(partidaId) {
  const p = DB.partidas.find(x => x.id === partidaId);
  if (!p) return;
  // Trabajamos sobre una copia: si se cancela, no se toca nada
  const estado = {
    fecha: p.fecha,
    buyin: p.buyin,
    notas: p.notas || '',
    participaciones: p.participaciones.map(x => ({ ...x })),
    eliminaciones: p.eliminaciones.map(x => ({ ...x }))
  };
  renderizarDialogoEdicion(partidaId, estado);
}

function renderizarDialogoEdicion(partidaId, estado) {
  const dlg = $('#dlgEditar');
  const jugadoresPartida = estado.participaciones.map(x => ({ id: x.jugadorId, nombre: nombreJugador(x.jugadorId) }));

  const filasParticipantes = estado.participaciones.map((x, i) => `
    <div class="fila-premio" style="align-items:center;flex-wrap:wrap">
      <span style="flex:1;min-width:90px">${esc(nombreJugador(x.jugadorId))}</span>
      <input type="number" data-edit-pos="${i}" value="${x.posicion ?? ''}" placeholder="Pos" style="width:55px" title="Posición">
      <input type="number" data-edit-rec="${i}" value="${x.recompras}" min="0" style="width:55px" title="Recompras">
      <input type="number" data-edit-add="${i}" value="${x.addons}" min="0" style="width:55px" title="Add-ons">
      <input type="number" data-edit-premio="${i}" value="${x.premio}" step="0.5" min="0" style="width:75px" title="Premio €">
    </div>`).join('');

  const filasElim = estado.eliminaciones.map((e, i) => `
    <div class="fila-premio" style="align-items:center;flex-wrap:wrap">
      <select data-elim-eliminador="${i}">${jugadoresPartida.map(j =>
        `<option value="${j.id}" ${j.id === e.eliminadorId ? 'selected' : ''}>${esc(j.nombre)}</option>`).join('')}</select>
      <span class="suave">elimina a</span>
      <select data-elim-eliminado="${i}">${jugadoresPartida.map(j =>
        `<option value="${j.id}" ${j.id === e.eliminadoId ? 'selected' : ''}>${esc(j.nombre)}</option>`).join('')}</select>
      <button data-elim-borrar="${i}" class="b-rojo" style="padding:5px 10px">✕</button>
    </div>`).join('');

  dlg.innerHTML = `
    <h2>✏️ Editar partida</h2>
    <label>Fecha</label>
    <input type="date" id="editFecha" value="${estado.fecha}">
    <label>Buy-in (€)</label>
    <input type="number" id="editBuyin" value="${estado.buyin}" step="0.5" min="0.5">
    <label>Notas</label>
    <input type="text" id="editNotas" value="${esc(estado.notas)}">
    <h2 style="margin-top:14px">Jugadores <span class="suave" style="font-weight:normal;font-size:.75rem">(pos · recompras · add-ons · premio)</span></h2>
    <div id="editParticipantes">${filasParticipantes}</div>
    <h2 style="margin-top:14px">Eliminaciones</h2>
    <div id="editEliminaciones">${filasElim || '<p class="suave">Sin eliminaciones</p>'}</div>
    <button id="btnAnadirElim" style="margin-top:8px">➕ Añadir eliminación</button>
    <div class="fila-botones" style="margin-top:14px">
      <button id="btnEditCancelar">Cancelar</button>
      <button class="b-oro" id="btnEditGuardar">Guardar cambios</button>
    </div>`;
  dlg.showModal();

  $('#btnEditCancelar').onclick = () => dlg.close();

  $('#btnAnadirElim').onclick = () => {
    if (jugadoresPartida.length < 2) return;
    estado.eliminaciones.push({
      eliminadorId: jugadoresPartida[0].id,
      eliminadoId: jugadoresPartida[1].id,
      orden: estado.eliminaciones.length + 1
    });
    guardarCambiosParciales();
    renderizarDialogoEdicion(partidaId, estado);
  };

  dlg.querySelectorAll('[data-elim-borrar]').forEach(b => b.onclick = () => {
    guardarCambiosParciales();
    estado.eliminaciones.splice(parseInt(b.dataset.elimBorrar), 1);
    renderizarDialogoEdicion(partidaId, estado);
  });

  // Guarda en el objeto "estado" lo que haya escrito el usuario antes de
  // volver a pintar el diálogo (al añadir/borrar una eliminación)
  function guardarCambiosParciales() {
    dlg.querySelectorAll('[data-edit-pos]').forEach(inp => {
      const v = inp.value.trim();
      estado.participaciones[parseInt(inp.dataset.editPos)].posicion = v === '' ? null : parseInt(v);

      estado.participaciones[parseInt(inp.dataset.editRec)].recompras = parseInt(inp.value) || 0;
    });
    dlg.querySelectorAll('[data-edit-add]').forEach(inp => {
      estado.participaciones[parseInt(inp.dataset.editAdd)].addons = parseInt(inp.value) || 0;
    });
    dlg.querySelectorAll('[data-edit-premio]').forEach(inp => {
      estado.participaciones[parseInt(inp.dataset.editPremio)].premio = parseFloat(inp.value) || 0;
    });
    dlg.querySelectorAll('[data-elim-eliminador]').forEach(sel => {
      estado.eliminaciones[parseInt(sel.dataset.elimEliminador)].eliminadorId = parseInt(sel.value);
    });
    dlg.querySelectorAll('[data-elim-eliminado]').forEach(sel => {
      estado.eliminaciones[parseInt(sel.dataset.elimEliminado)].eliminadoId = parseInt(sel.value);
    });
    estado.fecha = $('#editFecha').value || estado.fecha;
    estado.buyin = parseFloat($('#editBuyin').value) || estado.buyin;
    estado.notas = $('#editNotas').value;
  }

  $('#btnEditGuardar').onclick = () => {
    guardarCambiosParciales();
    estado.notas = estado.notas.trim();
    // Reindexamos el orden de las eliminaciones tras posibles borrados
    estado.eliminaciones.forEach((e, i) => e.orden = i + 1);

    const p = DB.partidas.find(x => x.id === partidaId);
    p.fecha = estado.fecha;
    p.buyin = estado.buyin;
    p.notas = estado.notas;
    p.participaciones = estado.participaciones;
    p.eliminaciones = estado.eliminaciones;
    guardar(DB);
    dlg.close();
    render();
  };
}

function statsRanking() {
  const filtros = [['todas', 'Todas'], ['5', '5 €'], ['10', '10 €']];
  const chips = filtros.map(([v, t]) =>
    `<div class="chip ${filtroRanking === v ? 'activo' : ''}" data-frank="${v}">${t}</div>`).join('');

  let partidas = DB.partidas;
  if (filtroRanking !== 'todas') partidas = partidas.filter(p => p.buyin === parseFloat(filtroRanking));

  // Acumulamos por jugador
  const acc = {};
  for (const j of DB.jugadores) acc[j.id] = { nombre: j.nombre, partidas: 0, victorias: 0, inv: 0, gan: 0, elim: 0, veces: 0 };
  for (const p of partidas) {
    for (const x of p.participaciones) {
      const a = acc[x.jugadorId]; if (!a) continue;
      a.partidas++; a.inv += invertido(x, p.buyin); a.gan += x.premio;
      if (x.posicion === 1) a.victorias++;
    }
    for (const e of p.eliminaciones) {
      if (acc[e.eliminadorId]) acc[e.eliminadorId].elim++;
      if (acc[e.eliminadoId]) acc[e.eliminadoId].veces++;
    }
  }
  const criterios = {
    balance: a => a.gan - a.inv,
    partidas: a => a.partidas,
    victorias: a => a.victorias,
    elim: a => a.elim,
    caidas: a => a.veces
  };
  const clave = criterios[ordenRanking] || criterios.balance;

  const opcionesOrden = [
    ['balance', '💰 Balance'], ['partidas', '🎲 Partidas'],
    ['victorias', '🏆 Victorias'], ['elim', '💀 Eliminaciones'], ['caidas', '☠ Veces eliminado']
  ].map(([v, t]) => `<option value="${v}" ${ordenRanking === v ? 'selected' : ''}>${t}</option>`).join('');

  const filas = Object.values(acc)
    .filter(a => a.partidas > 0)
    .sort((a, b) => clave(b) - clave(a))
    .map(a => {
      const bal = a.gan - a.inv;
      return `<tr><td>${esc(a.nombre)}</td><td>${a.partidas}</td><td>${a.victorias}</td>
        <td>${Math.round(100 * a.victorias / a.partidas)}%</td>
        <td>${eur(a.inv)}</td><td>${eur(a.gan)}</td>
        <td style="color:${bal >= 0 ? '#8fdc9f' : '#f08080'};font-weight:bold">${bal >= 0 ? '+' : ''}${eur(bal)}</td>
        <td>${a.elim}</td><td>${a.veces}</td></tr>`;
    }).join('');

  return `<div class="chips" style="margin-bottom:10px">${chips}</div>
    <label style="margin-top:0">Ordenar por</label>
    <select id="selOrdenRanking" style="margin-bottom:10px">${opcionesOrden}</select>
    <div class="carta tabla-scroll">
      <table><thead><tr><th>Jugador</th><th>Part.</th><th>Vict.</th><th>%</th>
      <th>Invertido</th><th>Ganado</th><th>Balance</th><th>Elim.</th><th>Caídas</th></tr></thead>
      <tbody>${filas || '<tr><td colspan="9" class="suave">Sin datos</td></tr>'}</tbody></table>
    </div>`;
}

function contarRivalidades() {
  const mapa = {}; // "eliminadorId-eliminadoId" -> veces
  for (const p of DB.partidas)
    for (const e of p.eliminaciones) {
      const k = e.eliminadorId + '-' + e.eliminadoId;
      mapa[k] = (mapa[k] || 0) + 1;
    }
  return Object.entries(mapa).map(([k, veces]) => {
    const [eliminador, eliminado] = k.split('-').map(Number);
    return { eliminador, eliminado, veces };
  }).sort((a, b) => b.veces - a.veces);
}

function statsMatriz() {
  const riv = contarRivalidades();
  const ids = [...new Set(riv.flatMap(r => [r.eliminador, r.eliminado]))];
  if (!ids.length) return '<div class="carta"><p class="suave">Todavía no hay eliminaciones registradas.</p></div>';

  const celda = (f, c) => {
    if (f === c) return '—';
    const r = riv.find(x => x.eliminador === f && x.eliminado === c);
    return r ? `<b style="color:var(--oro-claro)">${r.veces}</b>` : '·';
  };
  const cab = ids.map(id => `<th>${esc(nombreJugador(id))}</th>`).join('');
  const filas = ids.map(f =>
    `<tr><th>${esc(nombreJugador(f))}</th>${ids.map(c => `<td>${celda(f, c)}</td>`).join('')}</tr>`).join('');

  return `<div class="carta">
    <p class="suave">Cada celda: cuántas veces el jugador de la FILA ha eliminado al de la COLUMNA.</p>
    <div class="tabla-scroll"><table class="matriz">
      <thead><tr><th>elimina a →</th>${cab}</tr></thead><tbody>${filas}</tbody>
    </table></div></div>`;
}

function statsRivales() {
  const riv = contarRivalidades();
  if (!riv.length) return '<div class="carta"><p class="suave">Todavía no hay datos suficientes.</p></div>';

  // Jugadores que han participado en al menos una eliminación (como verdugo o víctima)
  const idsInvolucrados = [...new Set(riv.flatMap(r => [r.eliminador, r.eliminado]))];

  // Banner: el más letal del grupo (total de eliminaciones hechas, sumando todas sus víctimas)
  const totalPorEliminador = {};
  for (const r of riv) totalPorEliminador[r.eliminador] = (totalPorEliminador[r.eliminador] || 0) + r.veces;
  const [idTop, vecesTop] = Object.entries(totalPorEliminador).sort((a, b) => b[1] - a[1])[0];

  const banner = `
    <div class="carta" style="text-align:center;border-color:var(--oro)">
      <p class="suave" style="margin:0">👑 El más letal del grupo, de momento</p>
      <h2 style="margin:6px 0 0">${esc(nombreJugador(parseInt(idTop)))} — ${vecesTop} eliminaciones</h2>
    </div>`;

  const chips = idsInvolucrados.map(id =>
    `<div class="chip ${jugadorNemesisSel === id ? 'activo' : ''}" data-nemesis="${id}">${esc(nombreJugador(id))}</div>`
  ).join('');

  let detalle = '';
  if (jugadorNemesisSel !== null) {
    const nombre = nombreJugador(jugadorNemesisSel);
    const hechas = riv.filter(r => r.eliminador === jugadorNemesisSel).sort((a, b) => b.veces - a.veces);
    const recibidas = riv.filter(r => r.eliminado === jugadorNemesisSel).sort((a, b) => b.veces - a.veces);
    const nemesisPersonal = recibidas[0];

    const listaHechas = hechas.length
      ? hechas.map(r => `<div class="fila-premio"><span>💀 ${esc(nombreJugador(r.eliminado))}</span><b>${r.veces}</b></div>`).join('')
      : '<p class="suave">Todavía a nadie</p>';
    const listaRecibidas = recibidas.length
      ? recibidas.map(r => `<div class="fila-premio"><span>🔪 ${esc(nombreJugador(r.eliminador))}</span><b>${r.veces}</b></div>`).join('')
      : '<p class="suave">Nunca lo han eliminado</p>';

    detalle = `
      <div class="carta" style="margin-top:12px">
        <h2>🂠 ${esc(nombre)}</h2>
        ${nemesisPersonal ? `<p class="suave">😈 Su némesis es <b>${esc(nombreJugador(nemesisPersonal.eliminador))}</b>
           (lo ha eliminado ${nemesisPersonal.veces} ${nemesisPersonal.veces === 1 ? 'vez' : 'veces'})</p>` : ''}
        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:10px">
          <div style="flex:1;min-width:180px">
            <h2 style="font-size:.95rem">🔪 Ha eliminado a</h2>
            ${listaHechas}
          </div>
          <div style="flex:1;min-width:180px">
            <h2 style="font-size:.95rem">💀 Eliminado por</h2>
            ${listaRecibidas}
          </div>
        </div>
      </div>`;
  }

  const filasTabla = riv.map(r =>
    `<tr><td>${esc(nombreJugador(r.eliminador))}</td><td>${esc(nombreJugador(r.eliminado))}</td><td>${r.veces}</td></tr>`).join('');

  return `${banner}
    <div class="carta" style="margin-top:12px">
      <h2>🎯 Toca un jugador para ver su ficha</h2>
      <div class="chips">${chips}</div>
    </div>
    ${detalle}
    <div class="carta tabla-scroll" style="margin-top:12px">
      <h2>Ranking de rivalidades</h2>
      <table><thead><tr><th>Verdugo</th><th>Víctima</th><th>Veces</th></tr></thead><tbody>${filasTabla}</tbody></table>
    </div>`;
}

/* ============================================================
   PANTALLA: FUTURAS PARTIDAS
   Cualquiera puede anunciar una fecha y buy-in. Mientras no se
   registre la partida real de ese día, se puede apostar dentro
   de ella: quién va a ganar, o que TÚ vas a eliminar a alguien.
   Las cuotas se recalculan siempre a partir del historial real.
   ============================================================ */
let futuraBuyinSel = 5;
let futuraSeleccionadaId = null;
let apGanadorObjetivo = '';
let apMatarObjetivo = '';

function vistaFuturasPartidas() {
  const misPuntos = puntosDe(miIdentidadJugadorId);
  const cabecera = `<div class="bote">⭐ Tus puntos: ${misPuntos}</div>`;

  const formCrear = `
    <div class="carta">
      <h2>📅 Anunciar una futura partida</h2>
      <label>Fecha</label>
      <input type="date" id="futuraFecha" value="${hoy()}">
      <label>Buy-in</label>
      <div class="chips">
        <div class="chip ${futuraBuyinSel === 5 ? 'activo' : ''}" data-futurabuyin="5">🪙 5 €</div>
        <div class="chip ${futuraBuyinSel === 10 ? 'activo' : ''}" data-futurabuyin="10">🪙 10 €</div>
      </div>
      <button class="b-oro b-ancho" style="margin-top:10px" id="btnCrearFutura">📢 Anunciar</button>
    </div>`;

  const pendientes = DB.partidasFuturas || [];
  const listado = pendientes.length
    ? [...pendientes].sort((a, b) => a.fecha.localeCompare(b.fecha)).map(tarjetaFutura).join('')
    : '<div class="carta"><p class="suave">No hay partidas futuras anunciadas todavía. ¡Anuncia la primera!</p></div>';

  return `<h1>📅 Futuras partidas</h1>${cabecera}${formCrear}${listado}${vistaRankingPuntos()}`;
}

function tarjetaFutura(f) {
  const abierta = futuraSeleccionadaId === f.id;
  const cabeceraTarjeta = `
    <div class="carta" data-futuratoggle="${f.id}" style="cursor:pointer;${abierta ? 'border-color:var(--oro)' : ''}">
      <h2 style="margin:0">📅 ${f.fecha} · ${f.buyin} € <span class="suave" style="font-weight:normal">(toca para ${abierta ? 'cerrar' : 'apostar'})</span></h2>
    </div>`;

  if (!abierta) return cabeceraTarjeta;

  const opciones = DB.jugadores.map(j => `<option value="${j.id}">${esc(j.nombre)}</option>`).join('');
  const cuotaGanadorPreview = apGanadorObjetivo ? cuotaGanador(parseInt(apGanadorObjetivo), DB.jugadores.map(j => j.id)) : null;
  const cuotaMatarPreview = apMatarObjetivo ? cuotaMatar(miIdentidadJugadorId, parseInt(apMatarObjetivo)) : null;

  const misGanador = (f.apuestasGanador || []).filter(a => a.jugadorId === miIdentidadJugadorId);
  const misMatar = (f.apuestasMatar || []).filter(a => a.jugadorId === miIdentidadJugadorId);
  const misApuestasHtml = (misGanador.length || misMatar.length) ? `
      <h2 style="font-size:.95rem;margin-top:14px">Tus apuestas aquí</h2>
      ${misGanador.map(a => `<p class="suave">· ${a.cantidad} pts a que gana ${esc(nombreJugador(a.objetivoId))} (cuota x${a.cuota})</p>`).join('')}
      ${misMatar.map(a => `<p class="suave">· ${a.cantidad} pts a que eliminas a ${esc(nombreJugador(a.objetivoId))} (cuota x${a.cuota})</p>`).join('')}
    ` : '';

  const panel = `
    <div class="carta">
      <h2>🎲 Apostar en esta partida</h2>
      <h2 style="font-size:.95rem;margin:0 0 6px">¿Quién va a ganar?</h2>
      <select id="apGanadorObjetivo"><option value="">— elige —</option>${opciones}</select>
      ${cuotaGanadorPreview ? `<p class="suave">Cuota: <b>x${cuotaGanadorPreview}</b></p>` : ''}
      <input type="number" id="apGanadorCantidad" min="1" placeholder="Puntos a apostar" style="margin-top:6px">
      <button class="b-oro b-ancho" style="margin-top:8px" id="btnApostarGanador">Apostar al ganador</button>

      <h2 style="font-size:.95rem;margin:16px 0 6px">🔪 Apuesta a que TÚ vas a eliminar a...</h2>
      <select id="apMatarObjetivo">
        <option value="">— elige —</option>
        ${DB.jugadores.filter(j => j.id !== miIdentidadJugadorId).map(j => `<option value="${j.id}">${esc(j.nombre)}</option>`).join('')}
      </select>
      ${cuotaMatarPreview ? `<p class="suave">Cuota: <b>x${cuotaMatarPreview}</b></p>` : ''}
      <input type="number" id="apMatarCantidad" min="1" placeholder="Puntos a apostar" style="margin-top:6px">
      <button class="b-oro b-ancho" style="margin-top:8px" id="btnApostarMatar">Apostar a que la elimino yo</button>
      ${misApuestasHtml}
    </div>`;

  return cabeceraTarjeta + panel;
}

function vistaRankingPuntos() {
  const filas = DB.jugadores
    .map(j => ({ j, pts: puntosDe(j.id) }))
    .sort((a, b) => b.pts - a.pts)
    .map(({ j, pts }) => `<tr><td>${esc(j.nombre)}</td><td>${pts}</td></tr>`)
    .join('');
  return `<div class="carta tabla-scroll">
    <h2>🏆 Ranking de puntos</h2>
    <table><thead><tr><th>Jugador</th><th>Puntos</th></tr></thead><tbody>${filas}</tbody></table>
  </div>`;
}

/* ============================================================
   EVENTOS (se reenganchan tras cada render)
   ============================================================ */
function alerta(msg) { alert(msg); }

function enganchar() {
  // --- Configuración de partida ---
  document.querySelectorAll('[data-buyin]').forEach(el => el.onclick = () => {
    selBuyin = el.dataset.buyin === 'otro' ? 'otro' : parseFloat(el.dataset.buyin);
    render();
  });
  document.querySelectorAll('[data-jug]').forEach(el => el.onclick = () => {
    const id = parseInt(el.dataset.jug);
    selJugadores.has(id) ? selJugadores.delete(id) : selJugadores.add(id);
    render();
  });
  const btnEmpezar = $('#btnEmpezar');
  if (btnEmpezar) btnEmpezar.onclick = () => {
    let buyin = selBuyin;
    if (buyin === 'otro') {
      buyin = parseFloat($('#otroBuyin').value);
      if (!buyin || buyin <= 0) return alerta('Introduce un buy-in válido.');
    }
    if (selJugadores.size < 2) return alerta('Selecciona al menos 2 jugadores.');
    enCurso = nuevaPartidaEnCurso(buyin, $('#fecha').value || hoy(),
      $('#notas').value.trim(), [...selJugadores]);
    render();
  };
  const bcb = $('#btnContinuarBorrador'); if (bcb) bcb.onclick = () => {
    enCurso = borradorPendiente;
    borradorPendiente = null;
    render();
  };
  const bdb = $('#btnDescartarBorrador'); if (bdb) bdb.onclick = () => {
    if (!confirm('¿Descartar la partida sin terminar? No se podrá recuperar.')) return;
    borradorPendiente = null;
    borrarBorrador();
    render();
  };

  // --- Partida en curso ---
  document.querySelectorAll('[data-addon]').forEach(el =>
    el.onclick = () => accionAddon(parseInt(el.dataset.addon)));
  document.querySelectorAll('[data-recompra]').forEach(el =>
    el.onclick = () => accionRecompra(parseInt(el.dataset.recompra)));
  const be = $('#btnEliminar'); if (be) be.onclick = accionEliminar;
  const bd = $('#btnDeshacer'); if (bd) bd.onclick = accionDeshacer;
  const bf = $('#btnFinalizar'); if (bf) bf.onclick = accionFinalizar;
  const bc = $('#btnCancelar'); if (bc) bc.onclick = () => {
    if (confirm('¿Cancelar la partida? Se perderá lo registrado.')) {
      enCurso = null;
      borrarBorrador();
      render();
    }
  };

  // --- Historial ---
  document.querySelectorAll('[data-subh]').forEach(el =>
    el.onclick = () => { subHistorial = el.dataset.subh; partidaSeleccionada = null; render(); });
  document.querySelectorAll('[data-part]').forEach(el =>
    el.onclick = () => { partidaSeleccionada = parseInt(el.dataset.part); render(); });
  const be3 = $('#btnEditarPartida'); if (be3) be3.onclick = () => editarPartida(partidaSeleccionada);
  const bb = $('#btnBorrarPartida'); if (bb) bb.onclick = () => {
    if (!confirm('¿Borrar esta partida? No se puede deshacer.')) return;
    DB.partidas = DB.partidas.filter(p => p.id !== partidaSeleccionada);
    partidaSeleccionada = null;
    guardar(DB); render();
  };

  // --- Estadísticas ---
  document.querySelectorAll('[data-subs]').forEach(el =>
    el.onclick = () => { subStats = el.dataset.subs; render(); });
  document.querySelectorAll('[data-frank]').forEach(el =>
    el.onclick = () => { filtroRanking = el.dataset.frank; render(); });
  const selOrden = $('#selOrdenRanking'); if (selOrden) selOrden.onchange = () => {
    ordenRanking = selOrden.value; render();
  };
  document.querySelectorAll('[data-nemesis]').forEach(el => el.onclick = () => {
    const id = parseInt(el.dataset.nemesis);
    jugadorNemesisSel = jugadorNemesisSel === id ? null : id;
    render();
  });

  const bgg = $('#btnGuardarGrupo'); if (bgg) bgg.onclick = () => {
    const c = $('#inpGrupo').value.trim();
    if (!c) return alerta('Escribe un código de grupo.');
    if (!/^[a-zA-Z0-9_-]{4,40}$/.test(c))
      return alerta('Usa entre 4 y 40 letras, números, guiones o guiones bajos (sin espacios ni acentos).');
    if (!confirm('Al conectar, los datos del grupo en la nube pasarán a ser los que veas en este dispositivo. ¿Continuar?')) return;
    cambiarGrupo(c);
  };
  const bsg = $('#btnSalirGrupo'); if (bsg) bsg.onclick = () => {
    if (!confirm('¿Desconectar de la nube? Seguirás viendo los datos guardados en este dispositivo.')) return;
    cambiarGrupo('');
  };

  const bex = $('#btnExportar'); if (bex) bex.onclick = exportar;
  const bim = $('#btnImportar'); if (bim) bim.onclick = () => $('#ficheroImportar').click();
  const fim = $('#ficheroImportar'); if (fim) fim.onchange = importar;

  // --- Jugadores ---
  const ba = $('#btnAltaJugador'); if (ba) ba.onclick = altaJugador;
  const inNombre = $('#nuevoNombre');
  if (inNombre) inNombre.onkeydown = e => { if (e.key === 'Enter') altaJugador(); };
  document.querySelectorAll('[data-verperfil]').forEach(el => el.onclick = () => {
    const id = parseInt(el.dataset.verperfil);
    jugadorPerfilSel = jugadorPerfilSel === id ? null : id;
    render();
  });
  document.querySelectorAll('[data-borrarjug]').forEach(el => el.onclick = () => {
    DB.jugadores = DB.jugadores.filter(j => j.id !== parseInt(el.dataset.borrarjug));
    guardar(DB); render();
  });

  // --- Identidad (pantalla "¿Quién eres?") ---
  document.querySelectorAll('[data-elegirid]').forEach(el => el.onclick = () =>
    elegirIdentidad(parseInt(el.dataset.elegirid)));
  const bNuevaId = $('#btnNuevaIdentidad'); if (bNuevaId) bNuevaId.onclick = () => {
    const nombre = $('#nuevaIdentidad').value.trim();
    if (!nombre) return alerta('Escribe tu nombre.');
    if (DB.jugadores.some(j => j.nombre.toLowerCase() === nombre.toLowerCase())) {
      return alerta('Ya existe un jugador con ese nombre; selecciónalo en la lista.');
    }
    const nuevo = { id: DB.siguienteIdJugador++, nombre };
    DB.jugadores.push(nuevo);
    guardar(DB);
    elegirIdentidad(nuevo.id);
  };

  // --- Ajustes ---
  const bCerrarId = $('#btnCerrarIdentidad'); if (bCerrarId) bCerrarId.onclick = () => {
    if (confirm('¿Cambiar de identidad? Se te volverá a preguntar quién eres en este dispositivo.')) cerrarIdentidad();
  };
  const bGuardarPerfil = $('#btnGuardarPerfil'); if (bGuardarPerfil) bGuardarPerfil.onclick = () => {
    if (!DB.perfilesJugador) DB.perfilesJugador = {};
    if (!DB.perfilesJugador[miIdentidadJugadorId]) DB.perfilesJugador[miIdentidadJugadorId] = {};
    DB.perfilesJugador[miIdentidadJugadorId].manosFavoritas = $('#misManos').value.trim();
    const vict = $('#miVictima').value;
    DB.perfilesJugador[miIdentidadJugadorId].victimaPreferidaId = vict ? parseInt(vict) : null;
    guardar(DB);
    alerta('✅ Perfil actualizado.');
    render();
  };
  document.querySelectorAll('[data-tema]').forEach(el => el.onclick = () => {
    temaFondoActual = el.dataset.tema;
    aplicarTemaFondo(temaFondoActual);
    render();
  });

  // --- Futuras partidas: crear ---
  document.querySelectorAll('[data-futurabuyin]').forEach(el => el.onclick = () => {
    futuraBuyinSel = parseInt(el.dataset.futurabuyin);
    render();
  });
  const bCrearFutura = $('#btnCrearFutura'); if (bCrearFutura) bCrearFutura.onclick = () => {
    const fecha = $('#futuraFecha').value || hoy();
    if (!DB.partidasFuturas) DB.partidasFuturas = [];
    if (!DB.siguienteIdFutura) DB.siguienteIdFutura = 1;
    DB.partidasFuturas.push({
      id: DB.siguienteIdFutura++, fecha, buyin: futuraBuyinSel,
      creadaPorJugadorId: miIdentidadJugadorId,
      apuestasGanador: [], apuestasMatar: []
    });
    guardar(DB); render();
  };

  // --- Futuras partidas: abrir/cerrar tarjeta y apostar ---
  document.querySelectorAll('[data-futuratoggle]').forEach(el => el.onclick = () => {
    const id = parseInt(el.dataset.futuratoggle);
    futuraSeleccionadaId = futuraSeleccionadaId === id ? null : id;
    apGanadorObjetivo = ''; apMatarObjetivo = '';
    render();
  });
  const selApGanadorObj = $('#apGanadorObjetivo'); if (selApGanadorObj) selApGanadorObj.onchange = () => {
    apGanadorObjetivo = selApGanadorObj.value; render();
  };
  const selApMatarObj = $('#apMatarObjetivo'); if (selApMatarObj) selApMatarObj.onchange = () => {
    apMatarObjetivo = selApMatarObj.value; render();
  };
  const bApGanador = $('#btnApostarGanador'); if (bApGanador) bApGanador.onclick = () => {
    const futura = (DB.partidasFuturas || []).find(f => f.id === futuraSeleccionadaId);
    if (!futura) return;
    const objetivoId = parseInt($('#apGanadorObjetivo').value);
    const cantidad = parseInt($('#apGanadorCantidad').value);
    if (!objetivoId) return alerta('Elige a quién crees que va a ganar.');
    if (!cantidad || cantidad <= 0) return alerta('Indica cuántos puntos quieres apostar.');
    if (cantidad > puntosDe(miIdentidadJugadorId)) return alerta('No tienes suficientes puntos.');
    const cuota = cuotaGanador(objetivoId, DB.jugadores.map(j => j.id));
    asegurarPuntosInicializados(miIdentidadJugadorId);
    DB.puntos[miIdentidadJugadorId] -= cantidad;
    futura.apuestasGanador.push({ jugadorId: miIdentidadJugadorId, objetivoId, cantidad, cuota });
    guardar(DB);
    alerta(`✅ Apostados ${cantidad} puntos a que gana ${nombreJugador(objetivoId)} (cuota x${cuota}).`);
    render();
  };
  const bApMatar = $('#btnApostarMatar'); if (bApMatar) bApMatar.onclick = () => {
    const futura = (DB.partidasFuturas || []).find(f => f.id === futuraSeleccionadaId);
    if (!futura) return;
    const objetivoId = parseInt($('#apMatarObjetivo').value);
    const cantidad = parseInt($('#apMatarCantidad').value);
    if (!objetivoId) return alerta('Elige a quién dices que vas a eliminar.');
    if (!cantidad || cantidad <= 0) return alerta('Indica cuántos puntos quieres apostar.');
    if (cantidad > puntosDe(miIdentidadJugadorId)) return alerta('No tienes suficientes puntos.');
    const cuota = cuotaMatar(miIdentidadJugadorId, objetivoId);
    asegurarPuntosInicializados(miIdentidadJugadorId);
    DB.puntos[miIdentidadJugadorId] -= cantidad;
    futura.apuestasMatar.push({ jugadorId: miIdentidadJugadorId, objetivoId, cantidad, cuota });
    guardar(DB);
    alerta(`✅ Apostados ${cantidad} puntos a que eliminas a ${nombreJugador(objetivoId)} (cuota x${cuota}).`);
    render();
  };
}

function altaJugador() {
  const nombre = $('#nuevoNombre').value.trim();
  if (!nombre) return;
  if (DB.jugadores.some(j => j.nombre.toLowerCase() === nombre.toLowerCase()))
    return alerta('Ya existe un jugador con ese nombre.');
  DB.jugadores.push({ id: DB.siguienteIdJugador++, nombre });
  guardar(DB); render();
}

/* --- Exportar / importar copia de seguridad --- */
function exportar() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'poker-tracker-backup-' + hoy() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importar(ev) {
  const fichero = ev.target.files[0];
  if (!fichero) return;
  const lector = new FileReader();
  lector.onload = () => {
    try {
      const d = JSON.parse(lector.result);
      if (!Array.isArray(d.jugadores) || !Array.isArray(d.partidas)) throw new Error();
      if (!confirm('Esto SUSTITUYE los datos actuales por los del fichero. ¿Continuar?')) return;
      DB = d;
      guardar(DB); render();
      alerta('✅ Datos importados.');
    } catch (e) {
      alerta('El fichero no es una copia válida de Poker Tracker.');
    }
  };
  lector.readAsText(fichero);
  ev.target.value = '';
}

/* --- Service worker para funcionar sin conexión --- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

aplicarTemaFondo(temaFondoActual);
aplicarBonoDiario();
render();
iniciarNube();
</script>
